apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init-script
  namespace: emi
data:
  init.js: |
    const members = [0, 1, 2].map(i => ({ _id: i, host: "mongo-" + i + ".mongo:27017" }));
    function status() { try { return rs.status().members; } catch (e) { return null; } }
    function healthy() {
      const m = status();
      return m !== null &&
             m.filter(x => x.stateStr === "PRIMARY").length === 1 &&
             m.filter(x => x.stateStr === "SECONDARY").length === 2;
    }
    if (status() === null) {
      printjson(rs.initiate({ _id: "rs0", members: members }));
    } else {
      print("Replica set already initiated");
    }
    for (let i = 0; i < 90 && !healthy(); i++) sleep(2000);
    (status() || []).forEach(m => print(m.name + "  " + m.stateStr));
    if (!healthy()) { print("Replica set is not healthy"); quit(1); }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:6.0
          command: ["sh", "-c"]
          args:
            - |
              for h in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
                until mongosh --host "$h" --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; do
                  echo "waiting for $h"; sleep 3
                done
              done
              mongosh --host mongo-0.mongo --quiet /scripts/init.js
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: mongo-init-script
