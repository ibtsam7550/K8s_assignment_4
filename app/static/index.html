<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 960px">
  <h1 class="h3 mb-4">Loan EMI Calculator</h1>

  <div class="row g-4">
    <div class="col-md-5">
      <form id="emi-form" class="card card-body" novalidate>
        <div class="mb-3">
          <label class="form-label" for="principal">Loan amount (P)</label>
          <input class="form-control" id="principal" type="number" min="0.01" step="any" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="rate">Annual interest rate (%)</label>
          <input class="form-control" id="rate" type="number" min="0.01" max="100" step="any" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="months">Tenure (months)</label>
          <input class="form-control" id="months" type="number" min="1" max="600" step="1" required>
        </div>
        <button class="btn btn-primary" id="calc" type="submit">Calculate</button>
        <div id="error" class="alert alert-danger mt-3 mb-0 d-none" role="alert"></div>
      </form>
    </div>

    <div class="col-md-7">
      <div class="card card-body d-none" id="result-panel">
        <h2 class="h5">Result</h2>
        <dl class="row mb-0">
          <dt class="col-sm-5">Monthly EMI</dt><dd class="col-sm-7" id="r-emi"></dd>
          <dt class="col-sm-5">Total payment</dt><dd class="col-sm-7" id="r-total"></dd>
          <dt class="col-sm-5">Total interest</dt><dd class="col-sm-7" id="r-interest"></dd>
          <dt class="col-sm-5">Served by pod</dt><dd class="col-sm-7"><span id="r-pod"></span> (<span id="r-ip"></span>)</dd>
        </dl>
      </div>
    </div>
  </div>

  <h2 class="h5 mt-4">Last 10 calculations</h2>
  <div class="table-responsive">
    <table class="table table-sm table-striped bg-white" id="history">
      <thead><tr><th>Time</th><th>Principal</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Pod</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <footer class="text-muted small mt-4">EMI Calculator &middot; v1.0</footer>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  const money = v => Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const showError = msg => $("#error").text(msg).toggleClass("d-none", !msg);

  function loadHistory() {
    $.getJSON("/api/history").done(rows => {
      const $body = $("#history tbody").empty();
      if (!rows.length) $body.append($("<tr>").append($("<td>", {colspan: 6, class: "text-muted", text: "No calculations yet"})));
      rows.forEach(r => {
        const cells = [new Date(r.createdAt).toLocaleString(), money(r.principal), r.rate, r.months, money(r.emi), r.servedBy];
        $body.append($("<tr>").append(cells.map(c => $("<td>").text(c))));
      });
    }).fail(() => {
      $("#history tbody").empty().append($("<tr>").append($("<td>", {colspan: 6, class: "text-danger", text: "History unavailable"})));
    });
  }

  $("#emi-form").on("submit", function (e) {
    e.preventDefault();                      // AJAX only: no page reload
    showError("");
    const p = parseFloat($("#principal").val()), r = parseFloat($("#rate").val());
    const n = parseInt($("#months").val(), 10);
    if (!(p > 0 && r > 0 && n > 0 && Number($("#months").val()) === n)) {
      return showError("Enter positive numbers only (tenure must be a whole number of months).");
    }
    $("#calc").prop("disabled", true);
    $.ajax({url: "/api/emi", method: "POST", contentType: "application/json",
            data: JSON.stringify({principal: p, rate: r, months: n})})
      .done(res => {
        $("#r-emi").text(money(res.emi));
        $("#r-total").text(money(res.totalPayment));
        $("#r-interest").text(money(res.totalInterest));
        $("#r-pod").text(res.servedBy);
        $("#r-ip").text(res.podIp);
        $("#result-panel").removeClass("d-none");
        loadHistory();
      })
      .fail(xhr => showError((xhr.responseJSON && xhr.responseJSON.error) || "Server error, please try again."))
      .always(() => $("#calc").prop("disabled", false));
  });

  loadHistory();
</script>
</body>
</html>
